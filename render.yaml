services:
  - type: web
    name: project-memory
    runtime: python
    plan: free
    autoDeploy: true
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.api:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: AI_SAVE_QUOTA
        value: "0"
